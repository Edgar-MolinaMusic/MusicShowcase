<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edgar Molina | Music Composition Showcase</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; max-width: 800px; margin: 0 auto; padding: 20px; }
        header { text-align: center; margin-bottom: 50px; }
        h1 { color: #00ffcc; }
        .track { background: #1e1e1e; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        audio { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>Edgar Molina</h1>
        <p>Music Producer & Composer for Film, Games, and Artists</p>
    </header>

    <section id="portfolio">
        <h2>Works</h2>
        
        <!-- Track 1 -->
        <div class="track">
            <h3>Orchestralistimo</h3>
            <p>Style: Orchestral</p>
            <audio controls src="audio/OrchestralINTRO.mp3"></audio>
        </div>

        <!-- Track 2 -->
        <div class="track">
            <h3>The King Enters</h3>
            <p>Style: Symphonic Rock</p>
            <audio controls src="audio/TheKingEntersALL.mp3"></audio>
        </div>

        <!-- Track 3 -->
        <div class="track">
            <h3>Ambient Death</h3>
            <p>Style: Ambient</p>
            <audio controls src="audio/AmbientDeath.mp3"></audio>
    </section>

</body>
</html>
